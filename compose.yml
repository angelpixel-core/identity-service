name: identity

services:
  db:
    image: postgres:16-alpine
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-identity_db}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-identity_test_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/local/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-identity_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: identity-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    container_name: identity-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-identity_db}
      REDIS_URL: redis://cache:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      JWT_SECRET: ${JWT_SECRET:-super-secret-tenant-key-minimum-32-characters}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  web:
    build:
      context: .
      target: development
    container_name: identity-web
    restart: unless-stopped
    command: ["npm", "run", "dev:web"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      VITE_API_URL: http://api:4000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

  design-system:
    build:
      context: .
      target: development
    container_name: identity-design-system
    restart: unless-stopped
    profiles:
      - ui
      - dev
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data:
  cache_data:
