name: identity

services:
  db:
    image: postgres:16-alpine
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-identity_db}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-identity_test_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/local/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-identity_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: identity-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    container_name: identity-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-identity_db}
      REDIS_URL: redis://cache:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      JWT_SECRET: ${JWT_SECRET:-super-secret-tenant-key-minimum-32-characters}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  web:
    build:
      context: .
      target: development
    container_name: identity-web
    restart: unless-stopped
    command: ["npm", "run", "dev:web"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      VITE_API_URL: http://api:4000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

  design-system:
    build:
      context: .
      target: development
    container_name: identity-design-system
    restart: unless-stopped
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

  floci:
    image: floci/floci-az:latest
    container_name: floci-azure-arm
    restart: unless-stopped
    profiles:
      - cloud
      - infra
    ports:
      - "${FLOCI_AZURE_PORT:-4577}:4577"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      FLOCI_SECURITY_ALLOW_UNSAFE_NETWORK_EXPOSURE: "true"
      FLOCI_AZ_STORAGE_MODE: hybrid
      FLOCI_AZ_TLS_ENABLED: "true"
      FLOCI_AZ_PARITY: "azure"
    volumes:
      - floci_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4577/_floci/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingress:
    image: nginx:1.27-alpine
    container_name: identity-ingress
    restart: unless-stopped
    profiles:
      - ingress
      - cloud
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployments/ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/tls/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  db_data:
  cache_data:
  floci_data:
