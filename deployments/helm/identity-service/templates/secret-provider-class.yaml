{{- if .Values.keyVaultCSI.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "identity-service.secretProviderClassName" . }}
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.keyVaultCSI.provider | quote }}
  secretObjects:
    - secretName: {{ .Values.keyVaultCSI.secretName }}
      type: Opaque
      data:
        {{- range .Values.keyVaultCSI.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .secretKey }}
        {{- end }}
  parameters:
    usePodIdentity: {{ .Values.keyVaultCSI.usePodIdentity | quote }}
    useVMManagedIdentity: {{ .Values.keyVaultCSI.useVMManagedIdentity | quote }}
    userAssignedIdentityID: {{ .Values.keyVaultCSI.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.keyVaultCSI.keyvaultName | quote }}
    tenantId: {{ .Values.keyVaultCSI.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVaultCSI.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
{{- end }}
