# ==============================================================================
# Local Development & Emulation Overrides (k3d / kind + Floci Azure ARM) (US-14)
# ==============================================================================

replicaCount: 2

image:
  repository: idlocalacr.azurecr.io/identity-service
  pullPolicy: IfNotPresent
  tag: "local"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: 0

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false

# OpenTelemetry & Prometheus Metrics Scraping (US-21)
metrics:
  enabled: true
  path: /metrics
  port: 4000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "4000"

env:
  NODE_ENV: "development"
  PORT: "4000"
  CACHE_TTL_SECONDS: "300"
  JWT_EXPIRATION_SECONDS: "3600"
  PUBLIC_ISSUER_URL: "https://auth.angelpixel.local"

# Points to the Azure Key Vault provisioned on the local Floci emulator (US-12)
keyVaultCSI:
  enabled: true
  provider: "azure"
  rotationPollInterval: "2m"
  usePodIdentity: "false"
  useVMManagedIdentity: "true"
  userAssignedIdentityID: "00000000-0000-0000-0000-000000000000"
  keyvaultName: "id-local-kv"
  tenantId: "00000000-0000-0000-0000-000000000000"
  mountPath: "/mnt/secrets-store"
  secretName: "identity-kv-secrets"
  secrets:
    - objectName: "database-url"
      secretKey: "DATABASE_URL"
      envVar: "DATABASE_URL"
    - objectName: "jwt-secret"
      secretKey: "JWT_SECRET"
      envVar: "JWT_SECRET"
    - objectName: "redis-url"
      secretKey: "REDIS_URL"
      envVar: "REDIS_URL"

# Database connection and security configuration (US-17)
database:
  ssl:
    enabled: true
    minVersion: "TLSv1.2"
    caPath: "/mnt/secrets-store/ca.crt"

# Kubernetes NetworkPolicies for Zero-Trust micro-segmentation (US-18)
networkPolicy:
  enabled: true
  defaultDeny:
    enabled: true
  ingress:
    fromIngressController: true
    controllerNamespaceSelector:
      app.kubernetes.io/name: ingress-nginx
    controllerPodSelector:
      app.kubernetes.io/name: ingress-nginx
    port: 4000
  egress:
    dns:
      enabled: true
      port: 53
      namespace: kube-system
      selector:
        k8s-app: kube-dns
    postgres:
      enabled: true
      port: 5432
    redis:
      enabled: true
      port: 6379
    azureHTTPS:
      enabled: true
      port: 443
    customEgress:
      # Ports for local Floci Azure ARM emulator (4577: Resource Manager, 4578: Key Vault)
      - ports:
          - port: 4577
            protocol: TCP
          - port: 4578
            protocol: TCP
