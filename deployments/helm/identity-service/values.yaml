# ==============================================================================
# Default Production Values for identity-service Helm Chart (US-13 & US-14)
# ==============================================================================

# Number of stateless pod replicas for high availability
replicaCount: 2

# Container image configuration
image:
  repository: identity-service
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Zero-downtime deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: 0

# ServiceAccount configuration (used for Azure Workload Identity / CSI Driver)
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# OpenTelemetry & Prometheus Metrics Scraping (US-21)
metrics:
  enabled: true
  path: /metrics
  port: 4000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "4000"

# Pod-level security context (non-root execution)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security hardening
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Internal Kubernetes Service
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
  annotations: {}

# Ingress Controller with TLS termination (US-13)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Correlation-ID $http_x_correlation_id;
      proxy_set_header traceparent $http_traceparent;
  hosts:
    - host: auth.angelpixel.local
      paths:
        - path: /health
          pathType: Prefix
        - path: /.well-known
          pathType: Prefix
        - path: /oauth2
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /auth
          pathType: Prefix
  tls:
    - secretName: identity-tls-secret
      hosts:
        - auth.angelpixel.local

# Compute resource requests and limits to prevent noisy-neighbor saturation
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Startup Probe: verifies application bootstrap before liveness/readiness take over
# Prevents liveness restart cascades during heavy cold-starts or migrations
startupProbe: {}
  # httpGet:
  #   path: /health/live
  #   port: 4000
  # initialDelaySeconds: 5
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 12

# Liveness Probe: verifies Node.js process and event loop vitality (isolated, never checks external dependencies)
livenessProbe:
  httpGet:
    path: /health/live
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness Probe: actively verifies dependencies (PostgreSQL, Redis/Cache, KeyVault) for safe traffic routing
readinessProbe:
  httpGet:
    path: /health/ready
    port: 4000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# PodDisruptionBudget to guarantee availability during node drains / cluster upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# HorizontalPodAutoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

# Non-sensitive application environment variables
env:
  NODE_ENV: "production"
  PORT: "4000"
  CACHE_TTL_SECONDS: "300"
  JWT_EXPIRATION_SECONDS: "3600"
  PUBLIC_ISSUER_URL: "https://auth.angelpixel.local"

# Azure Key Vault Secrets Store CSI Driver integration (SecretProviderClass)
keyVaultCSI:
  enabled: true
  provider: "azure"
  rotationPollInterval: "2m"
  usePodIdentity: "false"
  useVMManagedIdentity: "true"
  userAssignedIdentityID: "00000000-0000-0000-0000-000000000000"
  keyvaultName: "id-prod-kv"
  tenantId: "00000000-0000-0000-0000-000000000000"
  mountPath: "/mnt/secrets-store"
  secretName: "identity-kv-secrets"
  secrets:
    - objectName: "database-url"
      secretKey: "DATABASE_URL"
      envVar: "DATABASE_URL"
    - objectName: "jwt-secret"
      secretKey: "JWT_SECRET"
      envVar: "JWT_SECRET"
    - objectName: "redis-url"
      secretKey: "REDIS_URL"
      envVar: "REDIS_URL"

# Database connection and security configuration (US-17)
database:
  ssl:
    enabled: true
    minVersion: "TLSv1.2"
    caPath: "/mnt/secrets-store/ca.crt"

# Kubernetes NetworkPolicies for Zero-Trust micro-segmentation (US-18)
# Complies with ISO/IEC 27001 Control A.13.1 & SOC 2 Type II CC6.6
networkPolicy:
  enabled: true
  defaultDeny:
    enabled: true
  ingress:
    fromIngressController: true
    controllerNamespaceSelector:
      app.kubernetes.io/name: ingress-nginx
    controllerPodSelector:
      app.kubernetes.io/name: ingress-nginx
    port: 4000
  egress:
    dns:
      enabled: true
      port: 53
      namespace: kube-system
      selector:
        k8s-app: kube-dns
    postgres:
      enabled: true
      port: 5432
    redis:
      enabled: true
      port: 6379
    azureHTTPS:
      enabled: true
      port: 443
    customEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
