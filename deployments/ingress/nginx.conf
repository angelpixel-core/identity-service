events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time req_id=$http_x_request_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # SSL Global Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Resolver DNS interno de Docker para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP Server: Forced 308 Permanent Redirect to HTTPS (Ingress-Nginx parity)
    server {
        listen 80;
        listen [::]:80;
        server_name auth.angelpixel.local localhost 127.0.0.1;

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # HTTPS Server: TLS Termination & Reverse Proxy
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name auth.angelpixel.local localhost 127.0.0.1;

        ssl_certificate     /etc/nginx/certs/auth.angelpixel.local.fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/auth.angelpixel.local.key;

        # Ingress-Nginx buffer settings for oversized JWT tokens
        proxy_buffer_size          128k;
        proxy_buffers              4 128k;
        proxy_busy_buffers_size    256k;
        client_max_body_size       10m;

        # Proxy header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location / {
            set $identity_backend http://api:4000;
            proxy_pass $identity_backend;
        }
    }
}
