name: floci-azure-emulator

services:
  floci:
    image: floci/floci:latest
    container_name: floci-azure-arm
    restart: unless-stopped
    ports:
      - "4577:4566"
      - "4566:4566"
    environment:
      - FLOCI_PORT=4566
      - QUARKUS_HTTP_HOST=0.0.0.0
      - FLOCI_SECURITY_ALLOW_UNSAFE_NETWORK_EXPOSURE=true
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_floci/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  floci_data:
