openapi: 3.1.0
info:
  title: AngelPixel Identity Service API
  description: |
    Enterprise Multi-Tenant Identity & Access Management (IdP) Service.
    Implements RFC 6749 (OAuth 2.0 Authorization Framework), RFC 7519 (JSON Web Tokens),
    Dynamic Client Registry and Multi-Tenant Isolation.
  version: 0.1.0
  contact:
    name: AngelPixel Platform Engineering
    url: https://angelpixel.io
    email: contact@angelpixel.io

servers:
  - url: http://localhost:4000
    description: Local Docker Compose Environment (API Container)
  - url: http://localhost:3000
    description: Local Development Server (Standalone Node.js)

tags:
  - name: Identity & Authentication
    description: User registration and authenticated profile management (US-01, US-02)
  - name: OAuth2 Client Registry
    description: Dynamic client application registry and origin validation (US-03)
  - name: OAuth2 Token
    description: RFC 6749 Client Credentials Grant token issuance for M2M services (US-04)
  - name: OIDC Discovery & JWKS
    description: OpenID Connect Discovery 1.0 (RFC 8414) and JSON Web Key Sets (RFC 7517) (US-07)

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Identity & Authentication
      summary: Register a new user under a tenant (US-01)
      description: |
        Creates a new user aggregate scoped strictly to the specified tenant.
        Issues an initial authentication JWT upon successful registration.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
        '400':
          description: Validation error in request payload or missing tenant header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — Email already registered within this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Identity & Authentication
      summary: Get authenticated user profile (US-02)
      description: |
        Returns sanitized user profile details. Employs a Cache-Aside strategy (Redis / In-Memory)
        and enforces tenant boundary validation (claims matching `x-tenant-id`).
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized — Missing, malformed, or expired Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — Token tenant claim does not match x-tenant-id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{userId}:
    get:
      tags:
        - Identity & Authentication
      summary: Get user profile by ID with Anti-Enumeration Guard (US-06)
      description: |
        Retrieves a user profile within the caller's tenant context. If the target user ID belongs
        to another tenant, returns 404 Not Found to prevent cross-tenant enumeration.
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user identifier
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: "Unauthorized — Missing or invalid Bearer token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Forbidden — Cross-tenant access violation detected"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Not Found — User does not exist in active tenant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Identity & Authentication
      summary: Update user profile with Cross-Tenant Zero-Trust Guard (US-06)
      description: |
        Updates a user profile within the authenticated tenant context. Aborts with 403 Forbidden
        and logs a CROSS_TENANT_VIOLATION security event if payload or header targets another tenant.
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: updated@alpha-corp.com
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '403':
          description: "Forbidden — Cross-tenant violation blocked and logged"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Not Found — User does not exist in active tenant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/oauth2/clients/validate:
    post:
      tags:
        - OAuth2 Client Registry
      summary: Validate client origin authorization (US-03)
      description: |
        Validates whether a client application is active and authorized to initiate
        authentication flows from the request Origin or Referer header.
      parameters:
        - name: x-client-id
          in: header
          required: false
          schema:
            type: string
          description: Client application identifier (alternative to body clientId)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateClientOriginRequest'
      responses:
        '200':
          description: Client and origin are valid and authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateClientOriginResponse'
        '400':
          description: Missing or invalid clientId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Client application is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin is not registered in client allowed_origins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client application does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth2/authorize:
    get:
      tags:
        - OAuth2 Authorization Code & PKCE
      summary: OAuth2 / OIDC Authorization Endpoint (RFC 6749 & RFC 7636 / US-08)
      description: |
        Initiates the Authorization Code Flow with PKCE. Public clients MUST provide `code_challenge`
        and `code_challenge_method=S256`. Successful requests redirect (302) to `redirect_uri` with `code`
        and optional `state`, or return JSON (200) when requested via `Accept: application/json`.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Client application identifier
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Pre-registered redirect URI for callback
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Must be "code"
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-delimited list of requested scopes (e.g. "openid profile email")
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: CSRF protection state parameter echoed back to client
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
          description: BASE64URL-encoded SHA-256 hash of code_verifier (RFC 7636)
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
          description: PKCE transformation method (S256 required for public clients)
        - name: nonce
          in: query
          required: false
          schema:
            type: string
          description: OIDC replay mitigation nonce injected into issued ID token
      responses:
        '302':
          description: Redirect to client callback URI with authorization code and state
          headers:
            Location:
              schema:
                type: string
                example: "https://shop.local/callback?code=splat123&state=xyz"
        '200':
          description: JSON authorization code response (when Accept application/json is present)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  redirect_uri:
                    type: string
                  state:
                    type: string
                  callback_url:
                    type: string
        '400':
          description: Unsupported response_type, invalid redirect_uri, or missing PKCE challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Client application not found or deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

    post:
      tags:
        - OAuth2 Authorization Code & PKCE
      summary: OAuth2 / OIDC Authorization Endpoint (POST alternative) (US-08)
      description: Alternative POST method for large parameter sets or interactive form submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - response_type
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                response_type:
                  type: string
                  enum: [code]
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256]
                nonce:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - response_type
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                response_type:
                  type: string
                  enum: [code]
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256]
                nonce:
                  type: string
      responses:
        '302':
          description: Redirect to client callback URI
        '200':
          description: JSON authorization response
        '400':
          description: Protocol validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

  /api/v1/oauth2/authorize:
    get:
      tags:
        - OAuth2 Authorization Code & PKCE
      summary: OAuth2 Authorize Endpoint Alias
      description: Alias to `/oauth2/authorize` under `/api/v1` prefix.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
      responses:
        '302':
          description: Redirect to client callback URI

  /api/v1/oauth2/token:
    post:
      tags:
        - OAuth2 Token
      summary: Issue OAuth2 Access & ID Tokens (Client Credentials & PKCE Authorization Code) (US-04, US-08)
      description: |
        Issues signed JWT access tokens and OpenID Connect RS256 id_tokens. Supports both
        `client_credentials` grant for M2M communication and `authorization_code` grant with PKCE
        (RFC 7636) for single-page and native applications.
      security:
        - BasicAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuth2TokenRequest'
      responses:
        '200':
          description: Tokens issued successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2TokenResponse'
        '400':
          description: Invalid request, invalid_grant, unsupported grant_type, invalid_scope, or unauthorized_client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Invalid client credentials or client is deactivated
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Basic realm="OAuth2"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

  /oauth2/token:
    post:
      tags:
        - OAuth2 Token
      summary: RFC 6749 Standard Token Endpoint Alias
      description: Alias to `/api/v1/oauth2/token` matching standard OAuth 2.0 discovery path.
      security:
        - BasicAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuth2TokenRequest'
      responses:
        '200':
          description: Tokens issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2TokenResponse'
        '400':
          description: OAuth2 protocol, invalid_grant, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

  /api/v1/oauth2/refresh:
    post:
      tags:
        - OAuth2 Session
      summary: Refresh Access Token with Sliding Session and HttpOnly Cookie (US-09)
      description: |
        Rotates the active Refresh Token (1-to-1 strict rotation), renewing the access token.
        Detects token reuse and automatically revokes all tokens within the compromised family.
        The refresh token can be delivered via HttpOnly Cookie (`refresh_token`) or request body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh token string (optional if sent via Cookie)
                client_id:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Session refreshed successfully. Sets updated HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=abc123...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/oauth2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2TokenResponse'
        '400':
          description: Missing refresh token or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Invalid, expired, or reused refresh token (family revocation triggered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

  /oauth2/refresh:
    post:
      tags:
        - OAuth2 Session
      summary: RFC Standard Refresh Endpoint Alias
      description: Alias to `/api/v1/oauth2/refresh`.
      responses:
        '200':
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2TokenResponse'

  /api/v1/oauth2/revoke:
    post:
      tags:
        - OAuth2 Session
      summary: Revoke Session / Logout (RFC 7009 / US-09)
      description: |
        Explicitly revokes a session / Refresh Token and invalidates its generation family.
        Clears the `refresh_token` HttpOnly cookie (`Max-Age=0`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                reason:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Session revoked and cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session revoked successfully

  /oauth2/revoke:
    post:
      tags:
        - OAuth2 Session
      summary: RFC 7009 Standard Revoke Endpoint Alias
      description: Alias to `/api/v1/oauth2/revoke`.
      responses:
        '200':
          description: Session revoked and cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/auth/federation/{provider}/login:
    get:
      tags:
        - Federation
      summary: Initiate External OIDC Federated Authentication (US-10)
      description: |
        Generates authorization URL pointing to Google Accounts or Microsoft Entra ID with cryptographic state and nonce parameters.
        Returns HTTP 302 redirect by default, or 200 OK JSON when format=json is specified.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: prompt
          in: query
          required: false
          schema:
            type: string
        - name: login_hint
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, redirect]
      responses:
        '302':
          description: Redirects browser to external IdP authorization URL
        '200':
          description: Authorization URL payload returned as JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  state:
                    type: string
                  nonce:
                    type: string
        '400':
          description: Invalid request parameters or unsupported provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'

  /api/v1/auth/federation/{provider}/callback:
    get:
      tags:
        - Federation
      summary: External OIDC Provider Callback & JIT Provisioning (US-10 & US-11)
      description: |
        Processes authorization code from external IdP (Google / Microsoft).
        Verifies cryptographic state anti-CSRF token, exchanges code for ID Token, verifies signature against provider JWKS,
        links account or provisions user Just-In-Time (JIT), issues native RS256 session tokens, and sets HttpOnly refresh cookie.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Callback processed successfully, account linked/provisioned, and session issued
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict refresh token cookie for sliding session rotation
              schema:
                type: string
                example: refresh_token=32_bytes_random_hex; Path=/api/v1/oauth2; HttpOnly; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  tokens:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_token:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      tenantId:
                        type: string
                  isNewUser:
                    type: boolean
                  linked:
                    type: boolean
                  userProfile:
                    type: object
                    properties:
                      provider:
                        type: string
                      externalSubjectId:
                        type: string
                      email:
                        type: string
                      emailVerified:
                        type: boolean
                      name:
                        type: string
                      picture:
                        type: string
                  statePayload:
                    type: object
                    properties:
                      tenantId:
                        type: string
                      clientId:
                        type: string
                      redirectUri:
                        type: string
                      provider:
                        type: string
        '400':
          description: Anti-CSRF verification failed or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: ID Token signature verification failed or email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
    post:
      tags:
        - Federation
      summary: External OIDC Provider Callback (POST / form_post mode) (US-10)
      description: Alias supporting POST callbacks from providers using form_post response mode.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                state:
                  type: string
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: Callback processed successfully
        '400':
          description: Invalid request or state
        '401':
          description: Authentication or verification failed

  /.well-known/openid-configuration:
    get:
      tags:
        - OIDC Discovery & JWKS
      summary: OpenID Connect Discovery 1.0 Metadata (RFC 8414 / US-07)
      description: |
        Returns OpenID Provider Configuration Information Document for dynamic client configuration.
        CORS enabled (`Access-Control-Allow-Origin: *`).
      responses:
        '200':
          description: OpenID Provider Metadata
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfigurationResponse'

  /.well-known/jwks.json:
    get:
      tags:
        - OIDC Discovery & JWKS
      summary: JSON Web Key Set (RFC 7517 / US-07)
      description: |
        Returns public cryptographic RSA keys in JWK format used for verifying RS256 token signatures.
        CORS enabled (`Access-Control-Allow-Origin: *`).
      responses:
        '200':
          description: Public cryptographic keys in JWKS format
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'

components:
  parameters:
    TenantIdHeader:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
        example: alpha-corp
      description: Multi-tenant organization identifier

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User or Service Bearer JWT signed token.
    BasicAuth:
      type: http
      scheme: basic
      description: Client ID and Client Secret encoded in base64.
    TenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Tenant context isolation header.

  schemas:
    RegisterUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: ValidPassword123!

    RegisterUserResponse:
      type: object
      required:
        - userId
        - email
        - tenantId
        - token
        - accessToken
        - createdAt
      properties:
        userId:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        email:
          type: string
          format: email
          example: user@example.com
        tenantId:
          type: string
          example: alpha-corp
        token:
          type: string
          description: Bearer JWT token
        accessToken:
          type: string
          description: Alias to token
        createdAt:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      required:
        - id
        - email
        - tenantId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        email:
          type: string
          format: email
          example: user@example.com
        tenantId:
          type: string
          example: alpha-corp
        createdAt:
          type: string
          format: date-time

    ValidateClientOriginRequest:
      type: object
      properties:
        clientId:
          type: string
          example: portal-web

    ValidateClientOriginResponse:
      type: object
      required:
        - authorized
        - clientId
        - clientType
      properties:
        authorized:
          type: boolean
          example: true
        clientId:
          type: string
          example: portal-web
        clientName:
          type: string
          example: AngelPixel Web Portal
        clientType:
          type: string
          enum: [public, confidential]
          example: public
        allowedOrigins:
          type: array
          items:
            type: string
          example: ["https://portal.angelpixel.io"]
        scopes:
          type: array
          items:
            type: string
          example: ["openid", "profile", "email"]

    OAuth2TokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: [client_credentials, authorization_code, refresh_token]
          example: authorization_code
        client_id:
          type: string
          example: e-commerce-spa
        client_secret:
          type: string
          example: ValidSecret123!_SuperSecureSecretForTesting_2026
        code:
          type: string
          description: Authorization code returned from /oauth2/authorize
          example: SplatCode1234567890
        redirect_uri:
          type: string
          description: Matching redirect URI provided in authorization request
          example: https://shop.local/callback
        code_verifier:
          type: string
          description: RFC 7636 PKCE code verifier (43-128 unreserved characters)
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
        refresh_token:
          type: string
          description: Refresh token string for session renewal (US-09)
          example: 8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
        scope:
          type: string
          example: openid profile

    OAuth2TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: Signed JWT access token conforming to RFC 7519
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        scope:
          type: string
          example: openid profile
        id_token:
          type: string
          description: Signed RS256 OpenID Connect ID token conforming to RFC 7519 & OIDC Core 1.0
        refresh_token:
          type: string
          description: New opaque refresh token when rotation occurs (US-09)
          example: 8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b

    OAuth2ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - unsupported_response_type
            - invalid_scope
          example: invalid_grant
        error_description:
          type: string
          example: "Authorization code has already been consumed (replay attack detected)"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: unauthorized_client_origin
        message:
          type: string
          example: "Origin https://malicious-site.com is not authorized for client portal-web."

    JsonWebKey:
      type: object
      required:
        - kty
        - use
        - alg
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          example: RSA
          description: Key family cryptographic algorithm
        use:
          type: string
          example: sig
          description: Intended use of the key (signature)
        alg:
          type: string
          example: RS256
          description: Specific cryptographic algorithm
        kid:
          type: string
          example: key-a1b2c3d4e5f6
          description: Unique Key Identifier
        n:
          type: string
          description: Modulus encoded in base64url
        e:
          type: string
          example: AQAB
          description: Exponent encoded in base64url

    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JsonWebKey'

    OpenIdConfigurationResponse:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          example: https://id.angelpixel.io
        authorization_endpoint:
          type: string
          example: https://id.angelpixel.io/oauth2/authorize
        token_endpoint:
          type: string
          example: https://id.angelpixel.io/api/v1/oauth2/token
        jwks_uri:
          type: string
          example: https://id.angelpixel.io/.well-known/jwks.json
        userinfo_endpoint:
          type: string
          example: https://id.angelpixel.io/api/v1/auth/me
        response_types_supported:
          type: array
          items:
            type: string
          example: ['code']
        subject_types_supported:
          type: array
          items:
            type: string
          example: ['public']
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          example: ['RS256']
        scopes_supported:
          type: array
          items:
            type: string
          example: ['openid', 'profile', 'email', 'identity:read', 'identity:write']
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          example: ['client_secret_basic', 'client_secret_post', 'none']
        claims_supported:
          type: array
          items:
            type: string
          example: ['sub', 'iss', 'aud', 'exp', 'iat', 'email', 'tenantId']
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          example: ['S256']
        grant_types_supported:
          type: array
          items:
            type: string
          example: ['authorization_code', 'client_credentials', 'refresh_token']
