name: 'Setup Node Environment'
description: 'Sets up Node.js with npm caching and installs dependencies deterministically'

inputs:
  node-version:
    description: 'Node.js version to set up'
    required: false
    default: '25.x'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci
